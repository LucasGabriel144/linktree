<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucas Gabriel | Linktree</title>
  <link rel="stylesheet" href="style.css">
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <main class="card-container">
    <!-- Cabeçalho do Cartão -->
    <header class="card-header">
      <button class="icon-btn" aria-label="Ação esquerda"><i data-lucide="sparkles"></i></button>
      <button class="icon-btn" aria-label="Partilhar"><i data-lucide="share-2"></i></button>
    </header>

    <!-- Perfil e Avatar -->
    <div class="profile-section">
      <div class="avatar-container">
        <img src="https://via.placeholder.com/120" alt="Foto de perfil de Lucas Gabriel" class="profile-avatar">
      </div>
      <h1 class="profile-title">Lucas Gabriel</h1>
      <p class="profile-subtitle">Bem-vindo ao meu Linktree!</p>
    </div>

    <!-- Lista de Links Principais -->
    <nav class="links-container">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="link-item">
        <i data-lucide="github"></i> Meu GitHub
      </a>
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="link-item">
        <i data-lucide="linkedin"></i> LinkedIn
      </a>
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="link-item">
        <i data-lucide="instagram"></i> Instagram
      </a>
    </nav>

    <!-- Rodapé e CTA -->
    <footer class="card-footer">
      <p class="cta-text">Junte-se a Lucas Gabriel no Linktree</p>
      
      <div class="footer-links">
        <a href="#">Cookie Preferences</a>
        <a href="#">Report</a>
        <a href="#">Privacy</a>
        <a href="#">Explore</a>
        <a href="#">About this account</a>
        <a href="#">More from Linktree</a>
      </div>
    </footer>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
