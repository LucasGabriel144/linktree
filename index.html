<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucas Gabriel | Linktree</title>
  <link rel="stylesheet" href="style.css">
  <!-- Ícones Opcionais (Lucide / FontAwesome) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <main class="card-container">
    <!-- Cabeçalho do Cartão -->
    <header class="card-header">
      <button class="icon-btn" aria-label="Ação esquerda"><i data-lucide="sparkles"></i></button>
      <button class="icon-btn" aria-label="Partilhar"><i data-lucide="share-2"></i></button>
    </header>

    <!-- Perfil -->
    <div class="profile-section">
      <h1 class="profile-title">Lucas Gabriel</h1>
      <p class="profile-subtitle">Bem-vindo ao meu Linktree!</p>
    </div>

    <!-- Secção Inferior / CTA -->
    <footer class="card-footer">
      <p class="cta-text">Junte-se a Lucas Gabriel no Linktree</p>
      
      <nav class="footer-links">
        <a href="#">Cookie Preferences</a>
        <a href="#">Report</a>
        <a href="#">Privacy</a>
        <a href="#">Explore</a>
        <a href="#">About this account</a>
        <a href="#">More from Linktree</a>
      </nav>
    </footer>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
