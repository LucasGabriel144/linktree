<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Gabriel</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones via FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <main class="profile-card">
        <header class="profile-header">
            <div class="avatar-container">
                <img src="foto-de-perfil.jpg" alt="Foto de Perfil" class="profile-avatar">
            </div>
        </header>

        <nav class="links-container">
            <a href="https://wa.me/seunumero" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-whatsapp btn-icon"></i>
                <span>WhatsApp</span>
            </a>
            
            <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-solid fa-location-dot btn-icon"></i>
                <span>Localização</span>
            </a>

            <a href="https://facebook.com/seu_usuario" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-facebook-f btn-icon"></i>
                <span>Facebook</span>
            </a>
        </nav>
    </main>

</body>
</html>
