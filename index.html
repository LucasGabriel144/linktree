
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Gabriel | Linktree</title>

    <!-- Ícones do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        
        <!-- Cartão Central -->
        <div class="profile-card">
            
            <!-- Conteúdo Superior -->
            <div class="card-content">
                
                <!-- Botões de Ação do Topo -->
                <div class="top-action-buttons">
                    <button class="action-btn" aria-label="Ação">
                        <i class="fas fa-asterisk"></i>
                    </button>
                    <button class="action-btn" aria-label="Compartilhar">
                        <i class="fas fa-share-nodes"></i>
                    </button>
                </div>

                <!-- Informações de Perfil -->
                <header>
                    <h1 class="profile-name">Lucas Gabriel</h1>
                    <p class="profile-bio">Bem-vindo ao meu Linktree!</p>
                </header>

                <!-- Lista de Links -->
                <main class="links-container">
                    <!-- Insira seus novos links aqui -->
                </main>

            </div>

            <!-- Rodapé -->
            <footer class="card-footer">
                <a href="#" class="footer-btn">Junte-se a Lucas Gabriel no Linktree</a>
                
                <nav class="sub-footer-links">
                    <a href="#">Cookie Preferences</a>
                    <span class="bullet">•</span>
                    <a href="#">Report</a>
                    <span class="bullet">•</span>
                    <a href="#">Privacy</a>
                    <span class="bullet">•</span>
                    <a href="#">Explore</a>
                    <span class="bullet">•</span>
                    <a href="#">About this account</a>
                    <span class="bullet">•</span>
                    <a href="#">More from Linktree</a>
                </nav>
            </footer>

        </div>
    </div>
</body>
</html>
