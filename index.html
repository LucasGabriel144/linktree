<body>
    <div class="main-container">
        
        <div class="profile-card">
            
            <div class="card-content">
                
                <div class="top-action-buttons">
                    <button class="action-btn" aria-label="Ação">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <circle cx="18" cy="5" r="3"/>
                            <circle cx="6" cy="12" r="3"/>
                            <circle cx="18" cy="19" r="3"/>

                </div>

                <header>
                    <h1 class="profile-name">Lucas Gabriel</h1>
                    <p class="profile-bio">Bem-vindo ao meu Linktree!</p>
                </header>

                <main class="links-container">
                    <!-- Botão do TikTok -->
                    <a href="https://www.tiktok.com/@seu_usuario" target="_blank" rel="noopener noreferrer" class="link-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-5.2-1.74 2.89 2.89 0 0 1 2.31-1.39h.09V9a6.33 6.33 0 0 0-1 .08 6.34 6.34 0 1 0 7.25 6.26V9.61a8.28 8.28 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.04z"/>
                        </svg>
                        <span>TikTok</span>
                    </a>
                </main>

            </div>

            <footer class="card-footer">
                <a href="#" class="footer-btn">Junte-se a Lucas Gabriel no Linktree</a>
