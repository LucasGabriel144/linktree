<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Gabriel | Linktree</title>

    <!-- Ícones do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        
        <!-- Cartão Central -->
        <div class="profile-card">
            
            <!-- Conteúdo Superior (Botões, Perfil e Links) -->
            <div class="card-content">
                
                <!-- Botões de Ação do Topo -->
                <div class="top-action-buttons">
                    <button class="action-btn" aria-label="Ação">
                        <i class="fas fa-asterisk"></i>
                    </button>
                    <button class="action-btn" aria-label="Compartilhar">
                        <i class="fas fa-arrow-up-from-bracket"></i>
                    </button>
                </div>

                <!-- Informações de Perfil (sem a foto) -->
                <header>
                    <h1 class="profile-name">Lucas Gabriel</h1>
                    <p class="profile-bio">Bem-vindo ao meu Linktree!</p>
                </header>

                <!-- Lista de Links -->
                <main class="links-container">
                    <a href="https://github.com/LucasGabriel144" class="link-btn vazado" target="_blank">
                        <i class="fab fa-github"></i>
                        <span class="btn-text">GitHub</span>
                        <i class="fas fa-ellipsis-v dots-icon"></i>
                    </a>

                    <a href="https://instagram.com/SEU_USUARIO" class="link-btn vazado" target="_blank">
                        <i class="fab fa-instagram"></i>
                        <span class="btn-text">Instagram</span>
                        <i class="fas fa-ellipsis-v dots-icon"></i>
                    </a>
                </main>

            </div>

            <!-- Rodapé Completo com os Links de Texto -->
            <footer class="card-footer">
                <a href="#" class="footer-btn">Junte-se a Lucas Gabriel no Linktree</a>
                
                <!-- Linha de Links do Sub-rodapé -->
                <nav class="sub-footer-links">
                    <a href="#">Cookie Preferences</a>
                    <span class="bullet">•</span>
                    <a href="#">Report</a>
                    <span class="bullet">•</span>
                    <a href="#">Privacy</a>
                    <span class="bullet">•</span>
                    <a href="#">Explore</a>
                    <span class="bullet">•</span>
                    <a href="#">About this account</a>
                    <span class="bullet">•</span>
                    <a href="#">More from Linktree</a>
                </nav>
            </footer>

        </div>
    </div>
</body>
</html>
